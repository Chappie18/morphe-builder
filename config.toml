
# ==========================================
# MORPHE BUILDER - APK ONLY
# ARM64 Android devices
# ==========================================

enable-module-update = false
parallel-jobs = 1

patches-version = "latest"
cli-version = "latest"

patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"


# ==========================================
# YOUTUBE
# ==========================================

[YouTube]

enabled = true
app-name = "YouTube"
pkg-name = "com.google.android.youtube"

build-mode = "apk"
arch = "arm64-v8a"
version = "auto"

enable-update-checks = false

apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"


# ==========================================
# YOUTUBE MUSIC
# ==========================================

[Music]

enabled = true
app-name = "Music"
pkg-name = "com.google.android.apps.youtube.music"

build-mode = "apk"
arch = "arm64-v8a"
version = "auto"

enable-update-checks = false

apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"


# ==========================================
# GOOGLE PHOTOS - DE-VANCED
# ==========================================

[GooglePhotos]

enabled = true
app-name = "Google Photos"
pkg-name = "com.google.android.apps.photos"

patches-source = "RookieEnough/De-Vanced"
rv-brand = "DeVanced"

build-mode = "apk"
arch = "arm64-v8a"
version = "auto"

enable-update-checks = false

apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.photos"


# ==========================================
# REDDIT - MORPHE
# ==========================================

[Reddit]

enabled = true
app-name = "Reddit"
pkg-name = "com.reddit.frontpage"

build-mode = "apk"
arch = "arm64-v8a"
version = "auto"
dpi = "120-640dpi"

enable-update-checks = false

apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit/"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.reddit.frontpage"


# ==========================================
# X / TWITTER - PIKO
# ==========================================

[X]

enabled = true
app-name = "X"
pkg-name = "com.twitter.android"

patches-source = "crimera/piko-newx"
rv-brand = "Piko"

build-mode = "apk"
arch = "arm64-v8a"
version = "auto"

enable-update-checks = false

apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter/"
